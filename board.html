<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>자유게시판</title>
        <link rel="stylesheet" href="board.css">
    </head>
    <body>
        <h1>자유게시판</h1>
        <div class="head">
            <span>번호</span>
            <span>제목</span>
            <span>작성자</span>
            <span>추천</span>
        </div>   
        <ol>
            
            <script>
                var posts=[
                    {number:43 , title:'첫글입니다' , author:'sidking' , likes: 4} , 
                    {number:42 , title:'안녕하세요' , author:'taemi' , likes: 42} , 
                    {number:41 , title:'오늘 코딩 시작함' , author:'sira' , likes: 128} ,
                    {number:40 , title:'테스트', author:'sidking', likes: 0}
                ];
                console.log(posts);

                var i = 0;
                while(i < posts.length) {
                    document.write('<li>');
                  document.write('<span>' + posts[i].number + '</span>');
                  document.write('<span>' + posts[i].title + '</span>');
                  document.write('<span>' + posts[i].author + '</span>');
                  document.write('<span>' + posts[i].likes + '</span>');
                  document.write('</li>');
                    i=1+i;
                }

                
            </script>
        </ol>
    </body>
</html>
