<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>자유게시판</title>
        <link rel="stylesheet" href="board.css">
    </head>
    <body>
        <h1>자유게시판</h1>
        <div class="head">
            <span>번호</span>
            <span>제목</span>
            <span>작성자</span>
            <span>추천</span>
            <span></span> 
        </div>   
        <ol id="list">
            
            
        </ol>
        <script>
                var posts=[
                    {number:43 , title:'첫글입니다' , author:'sidking' , likes: 4} , 
                    {number:42 , title:'안녕하세요' , author:'taemi' , likes: 42} , 
                    {number:41 , title:'오늘 코딩 시작함' , author:'sira' , likes: 128} ,
                    {number:40 , title:'테스트', author:'sidking', likes: 0}
                ];
                console.log(posts);

                function render (){
                   var html = '';
                   var i = 0;
                   while (i< posts.length) {
                    html= html + '<li>';
                    html= html + '<span>'+ posts[i].number + '</span>';
                  html= html + '<span>'+ posts[i].title + '</span>';
                  html= html + '<span>'+ posts[i].author + '</span>';
                  html= html + '<span>'+ posts[i].likes + '</span>';
                  html = html + '<span>' + posts[i].likes + '</span>';
                  html = html + '<span><button onclick="like(' + i + ')">추천</button></span>';

                  html= html+'</li>';
                    i=1+i;

                   }
                   document.querySelector('#list').innerHTML = html;

                }

                render();

                function like(index) {
                posts[index].likes = posts[index].likes + 1;
                render();
                }
                
                
                
            </script>
    </body>
</html>
